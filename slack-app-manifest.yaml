# The Slack app for claude-slack-bridge: paste this at https://api.slack.com/apps ->
# Create New App -> From a manifest. Rename it if you like (the two "Session Bridge" lines); keep
# the scopes as they are: the bridge needs exactly these two.
display_information:
  name: Session Bridge
  description: Questions from my Claude Code sessions, answered in the thread.
  background_color: "#2c2d30"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: session-bridge
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - im:history
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
